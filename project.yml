name: Porchlight
options:
  bundleIdPrefix: com.mingyucao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    # The version people see, set here and nowhere else; the app and its widgets share it.
    MARKETING_VERSION: "0.1.0"
    # Builds from Xcode or the simulator scripts say 0; deploy-ipad.sh and testflight.sh
    # pass the commit's build number (scripts/lib/version.sh).
    CURRENT_PROJECT_VERSION: "0"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
  # SQLiteData 1.13.0 with two patches, from our public fork (branch porchlight/update-order).
  # One: after a schema change, the sync engine updates the changed tables in dictionary order,
  # which differs from one engine to the next, so a child table could come before its
  # parent, fail its foreign key and stop the catch-up for every table after it, to be
  # retried and fail again on later launches. The patch sorts them parents first, as the
  # rest of the engine does (docs/design/dishes.md, "Why a card photo hangs off the dish";
  # OlderBuildSyncTests.updatingBringsInDishFacesParentsFirst). Two: a child iCloud refused
  # because its parent wasn't there (a walk's "who walked") was deleted on this device even
  # when the parent was here and had just not reached iCloud yet; it is now kept and both
  # are sent again, paced by the next change or launch, and a record iCloud turns down is
  # sent again the same way (docs/design/sync-icloud.md, "A record sent before its parent";
  # SyncDeferralsTests). Pinned by revision, not branch. Go back to pointfreeco/sqlite-data at the first release that carries the fix.
  SQLiteData:
    url: https://github.com/caomyer/sqlite-data
    revision: ba1f32c07667c0ee585a35057f1421f01f96ff33
  # Firebase, for one thing only: the relay that draws companion characters
  # (docs/design/companion-characters.md, "The relay's client"). Core, App Check (App Attest
  # proves a call comes from a genuine copy of the app) and Functions (the relay's two
  # callables). No Analytics, no Auth, no Firestore in the app. Pinned to an exact release.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.1.1
targets:
  Porchlight:
    type: application
    platform: iOS
    sources:
      - path: Porchlight
    dependencies:
      - package: GRDB
      - package: SQLiteData
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseFunctions
      - target: PorchlightWidgets
    info:
      path: Porchlight/Info.plist
      properties:
        # "Porchlight Seed" for the CloudKit schema seed's own app (scripts/cloud-schema.sh).
        CFBundleDisplayName: $(PORCHLIGHT_DISPLAY_NAME)
        # Set by MARKETING_VERSION and CURRENT_PROJECT_VERSION below; the scripts that sign
        # derive the build number from the commit (scripts/lib/version.sh).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The wall keeps its single light look and hidden status bar from launch; the
        # phone shows its status bar and launches in the system's light or night look.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UILaunchScreen~iphone:
          UIColorName: PocketLaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIStatusBarHidden~iphone: false
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Fraunces.ttf
          - DMSans.ttf
          - Caveat.ttf
        ITSAppUsesNonExemptEncryption: false
        # The relay's Firebase project, from Config/Firebase.xcconfig (git-ignored, written by
        # scripts/firebase-config.sh). Empty in a build without it: then Firebase is never
        # configured and nothing offers to draw a character.
        PorchlightFirebaseAppID: $(PORCHLIGHT_FIREBASE_APP_ID)
        PorchlightFirebaseAPIKey: $(PORCHLIGHT_FIREBASE_API_KEY)
        PorchlightFirebaseProjectID: $(PORCHLIGHT_FIREBASE_PROJECT_ID)
        PorchlightFirebaseSenderID: $(PORCHLIGHT_FIREBASE_SENDER_ID)
        # Firebase never wraps the app delegate, and App Check fetches a token only when a
        # call needs one, never on its own in the background.
        FirebaseAppDelegateProxyEnabled: false
        FirebaseAppCheckTokenAutoRefreshEnabled: false
        NSCalendarsFullAccessUsageDescription: Porchlight shows the calendars you choose, on Today and on your household's wall. It adds or changes an event only when you do, in the calendar you choose.
        NSCameraUsageDescription: Porchlight uses the camera to snap photos of your meals for the food diary.
        NSLocationWhenInUseUsageDescription: Porchlight uses your approximate location once to show local weather.
        # iCloud sync: the engine is woken by pushes, and the household is shared in M2.
        # Widgets turn over to the new day in background time (docs/design/beyond-the-app.md).
        UIBackgroundModes:
          - remote-notification
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.mingyucao.porchlight.widgets.refresh
          - com.mingyucao.porchlight.sync.send
          - com.mingyucao.porchlight.calendar.passOn
        CKSharingSupported: true
        # A widget's tap opens a tab: porchlight://lists, porchlight://today.
        CFBundleURLTypes:
          - CFBundleURLName: com.mingyucao.porchlight
            CFBundleURLSchemes:
              - porchlight
    entitlements:
      path: Porchlight/Porchlight.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.mingyucao.porchlight
        com.apple.developer.icloud-container-environment: $(PORCHLIGHT_CLOUDKIT_ENVIRONMENT)
        aps-environment: development
        # App Attest, which App Check uses to prove a call to the relay comes from a genuine
        # copy of the app on a real device. Production wherever CloudKit is Production.
        com.apple.developer.devicecheck.appattest-environment: $(PORCHLIGHT_APPATTEST_ENVIRONMENT)
        # The widgets read the summary the app writes here.
        com.apple.security.application-groups:
          - group.com.mingyucao.porchlight
    settings:
      base:
        # scripts/cloud-schema.sh seed overrides both, so its app installs beside Porchlight.
        PORCHLIGHT_BUNDLE_ID: com.mingyucao.porchlight
        PORCHLIGHT_DISPLAY_NAME: Porchlight
        PRODUCT_BUNDLE_IDENTIFIER: $(PORCHLIGHT_BUNDLE_ID)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # A Release build installed by cable and a TestFlight build must meet in the same
        # CloudKit environment, so Release uses Production; Debug, simulators and tests stay
        # on Development (docs/design/sync-icloud.md, "One iCloud for cable installs and TestFlight").
        Debug:
          PORCHLIGHT_CLOUDKIT_ENVIRONMENT: Development
          PORCHLIGHT_APPATTEST_ENVIRONMENT: development
        Release:
          PORCHLIGHT_CLOUDKIT_ENVIRONMENT: Production
          PORCHLIGHT_APPATTEST_ENVIRONMENT: production
  PorchlightWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PorchlightWidgets
      # Shared with the app: the summary, the timeline, the views and the widgets' intents.
      - path: Porchlight/WidgetsShared
      - path: Porchlight/Design/ThemeTokens.swift
      - path: Porchlight/Resources/Fonts
        includes: ["*.ttf"]
        buildPhase: resources
    info:
      path: PorchlightWidgets/Info.plist
      properties:
        CFBundleDisplayName: Porchlight
        # The app's own version and build: an extension must match its app.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Fraunces.ttf
          - DMSans.ttf
          - Caveat.ttf
    entitlements:
      path: PorchlightWidgets/PorchlightWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mingyucao.porchlight
    settings:
      base:
        PORCHLIGHT_BUNDLE_ID: com.mingyucao.porchlight
        PRODUCT_BUNDLE_IDENTIFIER: $(PORCHLIGHT_BUNDLE_ID).widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SKIP_INSTALL: YES
  PorchlightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PorchlightTests
    dependencies:
      - target: Porchlight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mingyucao.porchlight.tests
        GENERATE_INFOPLIST_FILE: YES
  PorchlightUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PorchlightUITests
    dependencies:
      - target: Porchlight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mingyucao.porchlight.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Porchlight
schemes:
  PorchlightUI:
    build:
      targets:
        Porchlight: all
        PorchlightUITests: [test]
    test:
      targets:
        - PorchlightUITests
  Porchlight:
    build:
      targets:
        Porchlight: all
        PorchlightTests: [test]
    test:
      targets:
        - PorchlightTests
