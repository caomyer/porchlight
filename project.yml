name: Porchlight
options:
  bundleIdPrefix: com.porchlight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
targets:
  Porchlight:
    type: application
    platform: iOS
    sources:
      - path: Porchlight
    dependencies:
      - package: GRDB
    info:
      path: Porchlight/Info.plist
      properties:
        CFBundleDisplayName: Porchlight
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Fraunces.ttf
          - DMSans.ttf
          - Caveat.ttf
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: Porchlight shows your household's calendars on the wall. It only reads them.
        NSCameraUsageDescription: Porchlight uses the camera to snap photos of your meals for the food diary.
        NSPhotoLibraryUsageDescription: Porchlight can show photos you pick on the wall in Ambient mode.
        NSLocationWhenInUseUsageDescription: Porchlight uses your approximate location once to show local weather.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.porchlight.porchlight
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PorchlightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PorchlightTests
    dependencies:
      - target: Porchlight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.porchlight.porchlight.tests
        GENERATE_INFOPLIST_FILE: YES
  PorchlightUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PorchlightUITests
    dependencies:
      - target: Porchlight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.porchlight.porchlight.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Porchlight
schemes:
  PorchlightUI:
    build:
      targets:
        Porchlight: all
        PorchlightUITests: [test]
    test:
      targets:
        - PorchlightUITests
  Porchlight:
    build:
      targets:
        Porchlight: all
        PorchlightTests: [test]
    test:
      targets:
        - PorchlightTests
