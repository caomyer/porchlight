name: Tests

# The unit tests and both UI suites on GitHub's hosted Macs, on the current iOS, so full
# runs do not compete for the development Mac. The iOS 17 run, for the wall iPad's own OS,
# stays local: scripts/test.sh.
#
# Each job is one small Mac (3 cores, 7 GB), which holds one simulator. One job builds,
# hands the build to the others as the "products" artifact, and then runs the unit tests.
# The UI suites run in shards of whole test classes (scripts/test.sh --shard), one per job,
# five jobs side by side, which is as many Macs as the plan runs at once. Each UI job boots
# its simulator while the build is still going, so the build is the only wait.
#
# Run by hand (Actions, Tests, Run workflow) with "only" set to run just those tests, e.g.
# "FirstRunTests PhoneTests/testCheckingChores", in one job that builds for itself.

on:
  push:
  workflow_dispatch:
    inputs:
      only:
        description: "Only these UI tests (Class or Class/testName, space separated); empty runs everything"
        required: false
        default: ""

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  PORCHLIGHT_TEST_SLOTS: "1"
  RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-2
  # Where scripts/test.sh builds for a checkout named "porchlight".
  PRODUCTS: /Users/runner/Library/Developer/Xcode/DerivedData/Porchlight-porchlight/Build/Products
  PACKAGES: /Users/runner/Library/Developer/Xcode/DerivedData/Porchlight-porchlight/SourcePackages

jobs:
  build:
    name: Build and unit tests
    if: ${{ !inputs.only }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore the Swift packages
        id: packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PACKAGES }}
          key: spm-${{ hashFiles('project.yml') }}

      - name: Pick the simulators
        run: zsh scripts/ci/pick-simulators.sh

      - name: Build
        run: zsh scripts/test.sh --build-only

      - name: Keep the Swift packages
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PACKAGES }}
          key: spm-${{ hashFiles('project.yml') }}

      - name: Pack the build
        run: |
          tar -cf products.tar -C "$PRODUCTS" .
          ls -lh products.tar

      - name: Hand the build to the UI jobs
        uses: actions/upload-artifact@v4
        with:
          name: products
          path: products.tar
          compression-level: 1
          retention-days: 1

      - name: Unit tests
        run: zsh scripts/ci/with-heartbeat.sh zsh scripts/test.sh --unit-only --no-build --progress --runtime "$RUNTIME"

      - name: Collect results
        if: always()
        run: zsh scripts/ci/collect-results.sh "${{ job.status }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-Unit
          path: results
          if-no-files-found: ignore
          retention-days: 7

  ui:
    name: ${{ matrix.name }}
    if: ${{ !inputs.only }}
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Wall UI 1 of 2
            kind: ipad
            args: --wall --ui-only --shard 1/2
          - name: Wall UI 2 of 2
            kind: ipad
            args: --wall --ui-only --shard 2/2
          - name: Phone UI 1 of 2
            kind: iphone
            args: --phone --ui-only --shard 1/2
          - name: Phone UI 2 of 2
            kind: iphone
            args: --phone --ui-only --shard 2/2
    steps:
      - uses: actions/checkout@v4

      - name: Pick the simulators
        run: zsh scripts/ci/pick-simulators.sh

      - name: Boot the ${{ matrix.kind }} while the build runs
        run: zsh scripts/ci/boot-simulator.sh ${{ matrix.kind }}

      - name: Wait for the build
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
        run: zsh scripts/ci/wait-for-build.sh

      - name: Get the build
        uses: actions/download-artifact@v4
        with:
          name: products

      - name: Unpack the build
        run: |
          mkdir -p "$PRODUCTS"
          tar -xf products.tar -C "$PRODUCTS"
          rm products.tar

      - name: Test
        run: zsh scripts/ci/with-heartbeat.sh zsh scripts/test.sh ${{ matrix.args }} --no-build --progress --runtime "$RUNTIME"

      - name: Collect results
        if: always()
        run: zsh scripts/ci/collect-results.sh "${{ job.status }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.name }}
          path: results
          if-no-files-found: ignore
          retention-days: 7

  chosen:
    name: Chosen tests
    if: ${{ inputs.only }}
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore the Swift packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PACKAGES }}
          key: spm-${{ hashFiles('project.yml') }}

      - name: Pick the simulators
        run: zsh scripts/ci/pick-simulators.sh

      - name: Test
        env:
          ONLY: ${{ inputs.only }}
        # Unquoted, so each test is its own word.
        run: zsh scripts/ci/with-heartbeat.sh zsh scripts/test.sh --only $ONLY --progress --runtime "$RUNTIME"

      - name: Collect results
        if: always()
        run: zsh scripts/ci/collect-results.sh "${{ job.status }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-Chosen
          path: results
          if-no-files-found: ignore
          retention-days: 7
