name: Tests

# The unit tests and the UI suites on GitHub's hosted Macs, on the current iOS, so runs do
# not compete for the development Mac. The iOS 17 run, for the wall iPad's own OS, stays
# local: scripts/test.sh.
#
# Two tiers (docs/design/testing.md, "Tiers"):
#   - A push to a working branch runs the unit tests and the smoke set (scripts/test.sh
#     --smoke), on three Macs: did this break something obvious?
#   - A push to integration/next or main, and any run by hand, runs the full suite, on
#     five Macs: the release gate. Run it by hand on a branch before asking to merge
#     (Actions, Tests, Run workflow, on that branch, with "only" left empty).
#
# Each job is one small Mac (3 cores, 7 GB), which holds one simulator, and the plan runs
# five at once. One job builds and hands the build to the others as the "products"
# artifact; only then do the five test jobs start (`needs: build`), so none holds a Mac
# while the build still waits for one. The UI suites run in shards of whole test classes of
# about equal time (scripts/test.sh --shard): the wall's in two, the phone's in three, and
# the unit tests run beside the wall's first shard.
#
# Run by hand with "only" set to run just those tests, e.g.
# "FirstRunTests PhoneTests/testCheckingChores", in one job that builds for itself.

on:
  push:
    # A push that changes nothing but the documentation builds and tests nothing: every file
    # it touched is under docs/ or is the README. Any other file in the push, and it runs.
    # Only these two places: a Markdown file inside a target's folder would be built into
    # the app, so "every .md" is not on this list. A run by hand is never filtered.
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these UI tests (Class or Class/testName, space separated); empty runs the full suite"
        required: false
        default: ""

# A newer push to a branch cancels that branch's run. A run by hand is in a group of its
# own: it neither cancels nor is cancelled by pushes, or by other runs by hand.
concurrency:
  group: tests-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  PORCHLIGHT_TEST_SLOTS: "1"
  RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-2
  # Where scripts/test.sh builds for a checkout named "porchlight".
  PRODUCTS: /Users/runner/Library/Developer/Xcode/DerivedData/Porchlight-porchlight/Build/Products
  PACKAGES: /Users/runner/Library/Developer/Xcode/DerivedData/Porchlight-porchlight/SourcePackages

jobs:
  build:
    name: Build
    if: ${{ !inputs.only }}
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore the Swift packages
        id: packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PACKAGES }}
          key: spm-${{ hashFiles('project.yml') }}

      - name: Build
        run: zsh scripts/test.sh --build-only

      - name: Keep the Swift packages
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PACKAGES }}
          key: spm-${{ hashFiles('project.yml') }}

      - name: Pack the build
        run: |
          tar -cf products.tar -C "$PRODUCTS" .
          ls -lh products.tar

      - name: Hand the build to the test jobs
        uses: actions/upload-artifact@v4
        with:
          name: products
          path: products.tar
          compression-level: 1
          retention-days: 1

  # The full suite: the release line, main, and any run by hand.
  test:
    name: ${{ matrix.name }}
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/next' }}
    runs-on: xcode-27
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit and Wall UI 1 of 2
            kind: ipad
            args: --wall --shard 1/2
          - name: Wall UI 2 of 2
            kind: ipad
            args: --wall --ui-only --shard 2/2
          - name: Phone UI 1 of 3
            kind: iphone
            args: --phone --ui-only --shard 1/3
          - name: Phone UI 2 of 3
            kind: iphone
            args: --phone --ui-only --shard 2/3
          - name: Phone UI 3 of 3
            kind: iphone
            args: --phone --ui-only --shard 3/3
    steps:
      - uses: actions/checkout@v4

      - name: Pick the simulators
        run: zsh scripts/ci/pick-simulators.sh

      # With the memory heartbeat, and a limit, so a boot that stalls says so: twice a job
      # that booted the iPad right after building on the same Mac was cancelled mid-boot,
      # with free memory near its lowest.
      - name: Boot the ${{ matrix.kind }}
        timeout-minutes: 15
        run: zsh scripts/ci/with-heartbeat.sh zsh scripts/ci/boot-simulator.sh ${{ matrix.kind }}

      - name: Get the build
        uses: actions/download-artifact@v4
        with:
          name: products

      - name: Unpack the build
        run: |
          mkdir -p "$PRODUCTS"
          tar -xf products.tar -C "$PRODUCTS"
          rm products.tar

      - name: Test
        run: zsh scripts/ci/with-heartbeat.sh zsh scripts/test.sh ${{ matrix.args }} --no-build --progress --runtime "$RUNTIME"

      - name: Collect results
        if: always()
        run: zsh scripts/ci/collect-results.sh "${{ job.status }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.name }}
          path: results
          if-no-files-found: ignore
          retention-days: 7

  # A push to a working branch: the unit tests and the smoke set, each on its own Mac.
  smoke:
    name: ${{ matrix.name }}
    needs: build
    if: ${{ !(github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/next') }}
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit
            kind: ipad
            args: --unit-only
          - name: Wall smoke
            kind: ipad
            args: --wall --ui-only --smoke
          - name: Phone smoke
            kind: iphone
            args: --phone --ui-only --smoke
    steps:
      - uses: actions/checkout@v4

      - name: Pick the simulators
        run: zsh scripts/ci/pick-simulators.sh

      - name: Boot the ${{ matrix.kind }}
        timeout-minutes: 15
        run: zsh scripts/ci/with-heartbeat.sh zsh scripts/ci/boot-simulator.sh ${{ matrix.kind }}

      - name: Get the build
        uses: actions/download-artifact@v4
        with:
          name: products

      - name: Unpack the build
        run: |
          mkdir -p "$PRODUCTS"
          tar -xf products.tar -C "$PRODUCTS"
          rm products.tar

      - name: Test
        run: zsh scripts/ci/with-heartbeat.sh zsh scripts/test.sh ${{ matrix.args }} --no-build --progress --runtime "$RUNTIME"

      - name: Collect results
        if: always()
        run: zsh scripts/ci/collect-results.sh "${{ job.status }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.name }}
          path: results
          if-no-files-found: ignore
          retention-days: 7

  chosen:
    name: Chosen tests
    if: ${{ inputs.only }}
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore the Swift packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PACKAGES }}
          key: spm-${{ hashFiles('project.yml') }}

      - name: Pick the simulators
        run: zsh scripts/ci/pick-simulators.sh

      - name: Test
        env:
          ONLY: ${{ inputs.only }}
        # Unquoted, so each test is its own word.
        run: zsh scripts/ci/with-heartbeat.sh zsh scripts/test.sh --only $ONLY --progress --runtime "$RUNTIME"

      - name: Collect results
        if: always()
        run: zsh scripts/ci/collect-results.sh "${{ job.status }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-Chosen
          path: results
          if-no-files-found: ignore
          retention-days: 7
