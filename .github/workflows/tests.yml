name: Tests

# The unit tests and the UI suites on GitHub's hosted Macs, on the current iOS, so runs do
# not compete for the development Mac. The iOS 17 run, for the wall iPad's own OS, stays
# local: scripts/test.sh.
#
# Two tiers (docs/design/testing.md, "Tiers"):
#   - A push to a working branch runs the unit tests and the smoke set (scripts/test.sh
#     --smoke), on three Macs: did this break something obvious?
#   - A push to integration/next or main, and any run by hand, runs the full suite, on
#     five Macs: the release gate. Run it by hand on a branch before asking to merge
#     (Actions, Tests, Run workflow, on that branch, with "only" left empty).
#
# Each job is one small Mac (3 cores, 7 GB), which holds one simulator, and the plan runs
# five at once. One job builds and hands the build to the others as the "products"
# artifact; only then do the five test jobs start (`needs: build`), so none holds a Mac
# while the build still waits for one. The UI suites run in shards of whole test classes of
# about equal time (scripts/test.sh --shard): the wall's in two, the phone's in three, and
# the unit tests run beside the wall's first shard.
#
# Run by hand with "only" set to run just those tests, e.g.
# "FirstRunTests PhoneTests/testCheckingChores", in one job that builds for itself.

on:
  push:
    # A push that changes nothing but the documentation builds and tests nothing: every file
    # it touched is under docs/ or is the README. Any other file in the push, and it runs.
    # Only these two places: a Markdown file inside a target's folder would be built into
    # the app, so "every .md" is not on this list. A run by hand is never filtered.
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these UI tests (Class or Class/testName, space separated); empty runs the full suite"
        required: false
        default: ""
      ipad:
        description: "For a measurement only: another iPad model for the wall's simulator, as a pattern of its type (e.g. iPad-Air-11-inch[^)]*); empty is the 13-inch iPad Pro"
        required: false
        default: ""
      quiet:
        description: "For a measurement only: launchd labels the simulators are not to start, space separated, or \"none\" to start everything; empty is com.apple.PosterBoard, as every run has it"
        required: false
        default: ""
      measure_boots:
        description: "For a measurement only: \"yes\" runs no test, and boots the wall's iPad twelve times, each on a Mac of its own, with and without its wallpaper and widget daemons, saying the memory every 15 seconds"
        required: false
        default: ""

# A newer push to a branch cancels that branch's run. A run by hand is in a group of its
# own: it neither cancels nor is cancelled by pushes, or by other runs by hand.
concurrency:
  group: tests-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # For a test job to download the build again when its first download arrives corrupted
  # (scripts/ci/unpack-build.sh).
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  PORCHLIGHT_TEST_SLOTS: "1"
  RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-2
  PORCHLIGHT_CI_IPAD: ${{ inputs.ipad }}
  # A new simulator's wallpaper daemon is not started: its first-boot work took these Macs
  # into swap, and jobs were cancelled in it (scripts/lib/simulators.sh).
  PORCHLIGHT_SIM_DISABLED_DAEMONS: ${{ inputs.quiet || 'com.apple.PosterBoard' }}
  # Where scripts/test.sh builds for a checkout named "porchlight".
  PRODUCTS: /Users/runner/Library/Developer/Xcode/DerivedData/Porchlight-porchlight/Build/Products
  PACKAGES: /Users/runner/Library/Developer/Xcode/DerivedData/Porchlight-porchlight/SourcePackages

jobs:
  build:
    name: Build
    if: ${{ !inputs.only && !inputs.measure_boots }}
    runs-on: xcode-27
    timeout-minutes: 40
    # What the packed build is, for the test jobs to check their download against.
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      bytes: ${{ steps.pack.outputs.bytes }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore the Swift packages
        id: packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PACKAGES }}
          key: spm-${{ hashFiles('project.yml') }}

      # Which simulators a run may shut down and which it waits for, and how a corrupted
      # download of the build is caught and fetched again, each checked with stand-ins.
      - name: Check the simulator rules, the build's download, the runner's start and the boot's stages
        run: |
          zsh scripts/ci/check-simulator-rules.sh
          zsh scripts/ci/check-unpack-build.sh
          zsh scripts/ci/check-runner-start.sh
          zsh scripts/ci/check-boot-simulator.sh

      - name: Build
        run: zsh scripts/test.sh --build-only

      - name: Keep the Swift packages
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PACKAGES }}
          key: spm-${{ hashFiles('project.yml') }}

      - name: Pack the build
        id: pack
        run: |
          tar -cf products.tar -C "$PRODUCTS" .
          ls -lh products.tar
          echo "sha256=$(shasum -a 256 products.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -f%z products.tar)" >> "$GITHUB_OUTPUT"

      - name: Hand the build to the test jobs
        uses: actions/upload-artifact@v4
        with:
          name: products
          path: products.tar
          compression-level: 1
          retention-days: 1

  # The full suite: the release line, main, and any run by hand.
  test:
    name: ${{ matrix.name }}
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/next' }}
    runs-on: xcode-27
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit and Wall UI 1 of 2
            kind: ipad
            args: --wall --shard 1/2
          - name: Wall UI 2 of 2
            kind: ipad
            args: --wall --ui-only --shard 2/2
          - name: Phone UI 1 of 3
            kind: iphone
            args: --phone --ui-only --shard 1/3
          - name: Phone UI 2 of 3
            kind: iphone
            args: --phone --ui-only --shard 2/3
          - name: Phone UI 3 of 3
            kind: iphone
            args: --phone --ui-only --shard 3/3
    steps:
      - uses: actions/checkout@v4

      - name: Pick the simulators
        run: zsh scripts/ci/pick-simulators.sh

      # With the memory heartbeat. The build is fetched, checked against the build job's
      # checksum and unpacked while the simulator boots (scripts/ci/boot-and-fetch.sh). Each
      # stage of the boot has a limit and fails naming the stage; a download that cannot be
      # put right fails saying it was corrupted. This step's limit is only the backstop.
      - name: Boot the ${{ matrix.kind }} and fetch the build
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: zsh scripts/ci/with-heartbeat.sh zsh scripts/ci/boot-and-fetch.sh ${{ matrix.kind }} "${{ needs.build.outputs.sha256 }}" "${{ needs.build.outputs.bytes }}"

      - name: Test
        run: zsh scripts/ci/with-heartbeat.sh zsh scripts/test.sh ${{ matrix.args }} --no-build --progress --runtime "$RUNTIME"

      - name: Collect results
        if: always()
        run: zsh scripts/ci/collect-results.sh "${{ job.status }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.name }}
          path: results
          if-no-files-found: ignore
          retention-days: 7

  # A push to a working branch: the unit tests and the smoke set, each on its own Mac.
  smoke:
    name: ${{ matrix.name }}
    needs: build
    if: ${{ !(github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/next') }}
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit
            kind: ipad
            args: --unit-only
          - name: Wall smoke
            kind: ipad
            args: --wall --ui-only --smoke
          - name: Phone smoke
            kind: iphone
            args: --phone --ui-only --smoke
    steps:
      - uses: actions/checkout@v4

      - name: Pick the simulators
        run: zsh scripts/ci/pick-simulators.sh

      # With the memory heartbeat. The build is fetched, checked against the build job's
      # checksum and unpacked while the simulator boots (scripts/ci/boot-and-fetch.sh). Each
      # stage of the boot has a limit and fails naming the stage; a download that cannot be
      # put right fails saying it was corrupted. This step's limit is only the backstop.
      - name: Boot the ${{ matrix.kind }} and fetch the build
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: zsh scripts/ci/with-heartbeat.sh zsh scripts/ci/boot-and-fetch.sh ${{ matrix.kind }} "${{ needs.build.outputs.sha256 }}" "${{ needs.build.outputs.bytes }}"

      - name: Test
        run: zsh scripts/ci/with-heartbeat.sh zsh scripts/test.sh ${{ matrix.args }} --no-build --progress --runtime "$RUNTIME"

      - name: Collect results
        if: always()
        run: zsh scripts/ci/collect-results.sh "${{ job.status }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.name }}
          path: results
          if-no-files-found: ignore
          retention-days: 7

  chosen:
    name: Chosen tests
    if: ${{ inputs.only && !inputs.measure_boots }}
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore the Swift packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PACKAGES }}
          key: spm-${{ hashFiles('project.yml') }}

      - name: Pick the simulators
        run: zsh scripts/ci/pick-simulators.sh

      - name: Test
        env:
          ONLY: ${{ inputs.only }}
        # Unquoted, so each test is its own word.
        run: zsh scripts/ci/with-heartbeat.sh zsh scripts/test.sh --only $ONLY --progress --runtime "$RUNTIME"

      - name: Collect results
        if: always()
        run: zsh scripts/ci/collect-results.sh "${{ job.status }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-Chosen
          path: results
          if-no-files-found: ignore
          retention-days: 7

  # A measurement, never part of a push: what booting the wall's iPad costs a hosted Mac,
  # which has 7 GB, and what it costs when the simulator is told not to start the daemons
  # behind its wallpapers and widgets (scripts/lib/simulators.sh). Each boot is on a new
  # Mac, as a test job's is, with nothing else running; the stages are given long limits so
  # that a slow one is timed rather than tried again, and the memory, the load and the
  # largest processes are said every 15 seconds, through the boot and for three minutes
  # after it. docs/design/testing.md, "Infrastructure failures", has what it found, and
  # what the same run found across four iPad models before this.
  boots:
    name: Boot ${{ matrix.name }} (${{ matrix.trial }})
    if: ${{ inputs.measure_boots == 'yes' }}
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        name: [as it is, no widgets, no wallpapers, neither]
        trial: [1, 2, 3]
        include:
          - name: as it is
            quiet: none
          - name: no widgets
            quiet: com.apple.chronod com.apple.liveactivitiesd
          - name: no wallpapers
            quiet: com.apple.PosterBoard
          - name: neither
            quiet: com.apple.PosterBoard com.apple.chronod com.apple.liveactivitiesd
    env:
      PORCHLIGHT_SIM_DISABLED_DAEMONS: ${{ matrix.quiet }}
      PORCHLIGHT_HEARTBEAT_SECONDS: "15"
      PORCHLIGHT_HEARTBEAT_TOP: "1"
      PORCHLIGHT_BOOT_SECONDS: "900"
      PORCHLIGHT_READY_SECONDS: "900"
    steps:
      - uses: actions/checkout@v4

      - name: Pick the simulators
        run: zsh scripts/ci/pick-simulators.sh

      - name: Boot the ipad
        run: zsh scripts/ci/with-heartbeat.sh zsh scripts/ci/boot-simulator.sh ipad

      - name: The three minutes after
        run: zsh scripts/ci/with-heartbeat.sh sleep 180

      # That the simulator still shows a home screen and still runs an app.
      - name: A picture of it, and Settings launched
        run: |
          mkdir -p results
          udid=$(xcrun simctl list devices booted | sed -n 's/.*(\([0-9A-F-]\{36\}\)) (Booted).*/\1/p' | head -1)
          xcrun simctl io "$udid" screenshot results/home.png
          xcrun simctl launch "$udid" com.apple.Preferences
          sleep 10
          xcrun simctl io "$udid" screenshot results/settings.png
          ps -axo comm= | grep -c CoreSimulator | sed 's/^/Simulator processes: /'

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.name }}-${{ matrix.trial }}
          path: results
          if-no-files-found: ignore
          retention-days: 3
